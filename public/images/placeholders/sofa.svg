<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <!-- Background -->
  <rect width="600" height="800" fill="#EAE6DF"/>
  
  <!-- Subtle Blueprint Grid -->
  <defs>
    <pattern id="archGridSofa" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8A8680" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="600" height="800" fill="url(#archGridSofa)"/>

  <!-- Border Hairline -->
  <rect x="28" y="28" width="544" height="744" fill="none" stroke="#8A8680" stroke-width="1" stroke-opacity="0.35"/>
  <rect x="36" y="36" width="528" height="728" fill="none" stroke="#8A8680" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Technical Corner Marks -->
  <path d="M 20 28 L 36 28 M 28 20 L 28 36" stroke="#E10A1D" stroke-width="1.5"/>
  <path d="M 580 28 L 564 28 M 572 20 L 572 36" stroke="#E10A1D" stroke-width="1.5"/>
  <path d="M 20 772 L 36 772 M 28 780 L 28 764" stroke="#E10A1D" stroke-width="1.5"/>
  <path d="M 580 772 L 564 772 M 572 780 L 572 764" stroke="#E10A1D" stroke-width="1.5"/>

  <!-- Header Typography -->
  <text x="50" y="70" font-family="'Newsreader', Georgia, serif" font-size="11" letter-spacing="3" fill="#8A8680">ATELIER° ARCHITECTURAL STUDY</text>
  <text x="50" y="92" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="20" fill="#141414">Palazzo Modular Sofa</text>
  <text x="550" y="70" text-anchor="end" font-family="monospace" font-size="10" fill="#E10A1D">PLATE NO. 02</text>
  <text x="550" y="86" text-anchor="end" font-family="monospace" font-size="9" fill="#8A8680">SCALE 1:20</text>

  <!-- Divider Line -->
  <line x1="50" y1="110" x2="550" y2="110" stroke="#141414" stroke-width="0.75" stroke-opacity="0.2"/>

  <!-- Sofa Vector Artwork (Elevation & Axonometric View) -->
  <g transform="translate(50, 230)">
    <!-- Ground Shadow -->
    <ellipse cx="250" cy="290" rx="230" ry="16" fill="#141414" fill-opacity="0.06"/>
    <line x1="20" y1="290" x2="480" y2="290" stroke="#8A8680" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Plinth Wooden Base -->
    <rect x="50" y="270" width="400" height="18" rx="2" fill="#2E2822" stroke="#141414" stroke-width="2"/>

    <!-- Main Backrest Structure -->
    <rect x="60" y="110" width="380" height="110" rx="14" fill="#DDD6C8" stroke="#141414" stroke-width="2.5"/>

    <!-- 3 Segmented Back Cushions -->
    <rect x="70" y="125" width="115" height="90" rx="8" fill="#ECE7DC" stroke="#141414" stroke-width="1.8"/>
    <rect x="192" y="125" width="116" height="90" rx="8" fill="#ECE7DC" stroke="#141414" stroke-width="1.8"/>
    <rect x="315" y="125" width="115" height="90" rx="8" fill="#ECE7DC" stroke="#141414" stroke-width="1.8"/>

    <!-- Deep Low-Slung Seat Cushions -->
    <rect x="55" y="195" width="125" height="78" rx="10" fill="#E4DDCF" stroke="#141414" stroke-width="2.5"/>
    <rect x="187" y="195" width="126" height="78" rx="10" fill="#E4DDCF" stroke="#141414" stroke-width="2.5"/>
    <rect x="320" y="195" width="125" height="78" rx="10" fill="#E4DDCF" stroke="#141414" stroke-width="2.5"/>

    <!-- Architectural Accent Cushion (Atelier Red Accent) -->
    <rect x="90" y="180" width="55" height="50" rx="4" transform="rotate(-6 90 180)" fill="#E10A1D" stroke="#141414" stroke-width="1.5"/>

    <!-- Armrests -->
    <rect x="40" y="165" width="35" height="105" rx="8" fill="#D5CEC0" stroke="#141414" stroke-width="2.2"/>
    <rect x="425" y="165" width="35" height="105" rx="8" fill="#D5CEC0" stroke="#141414" stroke-width="2.2"/>

    <!-- Dimension Witness Lines -->
    <g stroke="#8A8680" stroke-width="0.75">
      <line x1="40" y1="320" x2="460" y2="320"/>
      <line x1="40" y1="315" x2="40" y2="325"/>
      <line x1="460" y1="315" x2="460" y2="325"/>
      <text x="250" y="335" text-anchor="middle" font-family="monospace" font-size="9" fill="#141414">3400 mm</text>

      <line x1="485" y1="110" x2="485" y2="290"/>
      <line x1="480" y1="110" x2="490" y2="110"/>
      <line x1="480" y1="290" x2="490" y2="290"/>
      <text x="500" y="200" font-family="monospace" font-size="9" fill="#141414" transform="rotate(90 500 200)">680 mm</text>
    </g>
  </g>

  <!-- Technical Spec Footer -->
  <g transform="translate(50, 680)">
    <line x1="0" y1="0" x2="500" y2="0" stroke="#141414" stroke-width="0.75" stroke-opacity="0.2"/>
    <text x="0" y="24" font-family="monospace" font-size="10" fill="#141414">PRIMARY SPEC: BELGIAN LINEN / WALNUT PLINTH</text>
    <text x="0" y="40" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="12" fill="#8A8680">Low-slung rectilinear modular seating for monumental reception spaces.</text>
    <text x="500" y="24" text-anchor="end" font-family="monospace" font-size="9" fill="#E10A1D">OFFLINE RESILIENCE ASSET</text>
    <text x="500" y="40" text-anchor="end" font-family="monospace" font-size="9" fill="#8A8680">VERIFIED ARCHITECTURE</text>
  </g>
</svg>
